<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" fill="url(#grad)" />
  <rect width="800" height="533" fill="url(#grid)" />

  <!-- Frame Border -->
  <rect x="20" y="20" width="760" height="493" rx="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />

  <!-- Camera / Landscape Icon -->
  <g transform="translate(400, 231.5)">
    <circle cx="0" cy="0" r="38" fill="#ffffff" fill-opacity="0.12" />
    <circle cx="0" cy="0" r="30" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" fill="none" />
    <path d="M -16 6 L 16 6 L 12 -12 L -12 -12 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="0" cy="-3" r="5" fill="#D97706" />
    <circle cx="10" cy="-8" r="1.5" fill="#ffffff" />
  </g>

  <!-- Title -->
  <text x="400" y="301.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="0.5">
    Library & Media Centre
  </text>

  <!-- Subtitle -->
  <text x="400" y="331.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#D1FAE5" opacity="0.85">
    Curated 5,000+ Books & Digital Catalog (800x533)
  </text>

  <!-- Watermark badge -->
  <rect x="320" y="478" width="160" height="26" rx="13" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
  <text x="400" y="495" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#FCD34D" letter-spacing="1">
    DPS PALI DISTRICT
  </text>
</svg>