<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#grad)" />
  <rect width="1920" height="1080" fill="url(#grid)" />

  <!-- Frame Border -->
  <rect x="20" y="20" width="1880" height="1040" rx="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />

  <!-- Camera / Landscape Icon -->
  <g transform="translate(960, 505)">
    <circle cx="0" cy="0" r="38" fill="#ffffff" fill-opacity="0.12" />
    <circle cx="0" cy="0" r="30" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" fill="none" />
    <path d="M -16 6 L 16 6 L 12 -12 L -12 -12 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="0" cy="-3" r="5" fill="#D97706" />
    <circle cx="10" cy="-8" r="1.5" fill="#ffffff" />
  </g>

  <!-- Title -->
  <text x="960" y="575" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="26" fill="#ffffff" letter-spacing="0.5">
    DPS Pali District — Campus Facade
  </text>

  <!-- Subtitle -->
  <text x="960" y="605" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="15" fill="#D1FAE5" opacity="0.85">
    Main Building & Entrance Gate (1920x1080)
  </text>

  <!-- Watermark badge -->
  <rect x="880" y="1025" width="160" height="26" rx="13" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
  <text x="960" y="1042" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#FCD34D" letter-spacing="1">
    DPS PALI DISTRICT
  </text>
</svg>