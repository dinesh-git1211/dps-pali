<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A5C36" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#grad)" />
  <rect width="400" height="400" fill="url(#grid)" />

  <!-- Frame Border -->
  <rect x="20" y="20" width="360" height="360" rx="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />

  <!-- Camera / Landscape Icon -->
  <g transform="translate(200, 165)">
    <circle cx="0" cy="0" r="38" fill="#ffffff" fill-opacity="0.12" />
    <circle cx="0" cy="0" r="30" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" fill="none" />
    <path d="M -16 6 L 16 6 L 12 -12 L -12 -12 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="0" cy="-3" r="5" fill="#D97706" />
    <circle cx="10" cy="-8" r="1.5" fill="#ffffff" />
  </g>

  <!-- Title -->
  <text x="200" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#ffffff" letter-spacing="0.5">
    Principal Portrait
  </text>

  <!-- Subtitle -->
  <text x="200" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#D1FAE5" opacity="0.85">
    DPS Pali District (400x400)
  </text>

  <!-- Watermark badge -->
  <rect x="120" y="345" width="160" height="26" rx="13" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
  <text x="200" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#FCD34D" letter-spacing="1">
    DPS PALI DISTRICT
  </text>
</svg>